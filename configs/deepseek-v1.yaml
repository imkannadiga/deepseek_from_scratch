# DeepSeek-V1 style: MHA + RoPE + MoE
# Same backbone and training budget as gpt-2 -- only the architecture differs.
# d_ff is gpt-2's divided by top_k, so 2 active experts cost the same FLOPs as
# gpt-2's one dense FFN. The extra capacity is free, which is the whole MoE claim.
# Run with: python train.py --config-name deepseek-v1

name: deepseek-v1

seed: 1337
device: auto        # auto | cuda | cpu
compile: false      # keep false across all three so wall-clock stays comparable

data:
  dataset_name: tiny_shakesphere
  corpus_path: ./data/_data/tiny_shakesphere.txt
  test_split: 0.05
  val_split: 0.05

tokenizer:
  path: ./data/_data/tokenizer/tiny_shakesphere-v${tokenizer.vocab_size}/
  vocab_size: 50000
  min_occurrences: 10

model:
  _target_: models.deepseek_v1.DeepSeek
  d_in: 64
  max_seq_length: 512          # context limit -- sizes the RoPE tables and causal mask
  d_transformer: 64
  n_blocks: 4
  transformer_n_heads: 8       # head_dim = 8, must be even for RoPE
  n_experts_routed: 16          # plain MoE: one expert size, no sharing
  top_k_routed: 4
  d_ff_routed: 128 
  n_experts_shared: 0
  d_ff_shared: 0
  moe_loss: aux                # standard auxiliary balance loss
  gate: softmax
  gamma: 0.001                 # unused while moe_loss is "aux"
  dropout: 0.2

optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.1
  betas: [0.9, 0.95]           # lr comes from training.lr_peak

training:
  n_steps: 10000
  batch_size: 256
  seq_len: 512                 # must be <= model.max_seq_length
  lr_peak: 3e-4
  lr_min: 3e-6
  warmup_steps: 100
  grad_clip: 1.0
  aux_alpha: 0.01              # weight on the MoE balance loss

eval:
  log_every: 500
  eval_every: 1000
  eval_steps: 50
  prompt: "First Citizen:\nBefore we proceed"
  max_new_tokens: 100
  temperature: 0.8

checkpoint:
  path: checkpoints/deepseek-v1/train.pt
  save_every: 1000

hydra:
  job:
    chdir: false               # keep cwd at repo root so relative paths resolve
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
