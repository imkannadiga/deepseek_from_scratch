# DeepSeek-V2 style: MLA + DeepSeekMoE, balanced with the standard auxiliary loss.
# Two changes from deepseek-v1: MHA -> MLA (a memory win, ~3x smaller KV cache,
# not a quality win), and plain MoE -> DeepSeekMoE (fine-grained experts + a
# shared expert). Balancing still costs an auxiliary loss term; V3 removes that.
# Run with: python train.py --config-name deepseek-v2

name: deepseek-v2

seed: 1337
device: auto        # auto | cuda | cpu
compile: false      # keep false across all three so wall-clock stays comparable

data:
  dataset_name: tiny_shakesphere
  corpus_path: ./data/_data/tiny_shakesphere.txt
  test_split: 0.05
  val_split: 0.05

tokenizer:
  path: ./data/_data/tokenizer/tiny_shakesphere-v${tokenizer.vocab_size}/
  vocab_size: 50000
  min_occurrences: 10

model:
  _target_: models.deepseek_v2.DeepSeek
  d_in: 384
  d_kv: 192                    # compressed KV latent, d_in/2 -- what MLA caches
  max_seq_length: 512          # context limit -- sizes the RoPE tables and causal mask
  d_transformer: 384
  n_blocks: 6
  transformer_n_heads: 6       # head_dim = 64
  rope_head_dim: 32            # head_dim/2, matching the paper's ratio; must be even
  n_experts_routed: 8         # v1's 8 experts split 2-way into 16, one isolated as shared
  top_k_routed: 2
  d_ff_routed: 384             # 16*768 total and 4*768 active both match v1's 8*1536 / 2*1536
  n_experts_shared: 1          # shared expert isolation: always on, never routed
  d_ff_shared: 384
  moe_loss: aux
  gate: softmax
  gamma: 0.001                 # unused while moe_loss is "aux"
  dropout: 0.2

optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.1
  betas: [0.9, 0.95]           # lr comes from training.lr_peak

training:
  n_steps: 10000
  batch_size: 256
  seq_len: 512                 # must be <= model.max_seq_length
  lr_peak: 3e-4
  lr_min: 3e-5
  warmup_steps: 50
  grad_clip: 1.0
  aux_alpha: 0.01              # weight on the MoE balance loss

eval:
  log_every: 500
  eval_every: 50
  eval_steps: 100
  prompt: "First Citizen:\nBefore we proceed"
  max_new_tokens: 100
  temperature: 0.8

checkpoint:
  path: checkpoints/deepseek-v2/train.pt
  save_every: 1000

hydra:
  job:
    chdir: false               # keep cwd at repo root so relative paths resolve
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
