# DeepSeek-V3 style: same MLA + DeepSeekMoE as v2, balanced without any loss term.
# The only differences from deepseek-v2 are moe_loss and gate: the router scores
# experts with a sigmoid and a per-expert bias is nudged toward even load, so the
# objective stays pure cross-entropy. Multi-token prediction is not implemented.
# Run with: python train.py --config-name deepseek-v3

name: deepseek-v3

seed: 1337
device: auto        # auto | cuda | cpu
compile: false      # keep false across all four so wall-clock stays comparable

data:
  dataset_name: tiny_shakesphere
  corpus_path: ./data/_data/tiny_shakesphere.txt
  test_split: 0.05
  val_split: 0.05

tokenizer:
  path: ./data/_data/tokenizer/tiny_shakesphere-v${tokenizer.vocab_size}/
  vocab_size: 50000
  min_occurrences: 10

model:
  _target_: models.deepseek_v3.DeepSeek
  d_in: 32
  d_kv: 16                     # compressed KV latent, d_in/2 -- what MLA caches
  max_seq_length: 512          # context limit -- sizes the RoPE tables and causal mask
  d_transformer: 32
  n_blocks: 4
  transformer_n_heads: 4       # head_dim = 8
  rope_head_dim: 4             # head_dim/2, matching the paper's ratio; must be even
  n_experts_routed: 16         # fine-grained: 16 small experts instead of 8 big ones
  top_k_routed: 6
  d_ff_routed: 32              # 1 shared (64) + 6 routed (6*32) = gpt-2's 256
  n_experts_shared: 1          # shared expert isolation: always on, never routed
  d_ff_shared: 64
  moe_loss: free               # <- NEW vs v2: no auxiliary loss at all
  gate: sigmoid                # <- NEW vs v2: sigmoid affinity, normalised top-k
  gamma: 0.001                 # bias step size, the whole balancing mechanism
  dropout: 0.2

optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.1
  betas: [0.9, 0.95]           # lr comes from training.lr_peak

training:
  n_steps: 10000
  batch_size: 256
  seq_len: 512                 # must be <= model.max_seq_length
  lr_peak: 3e-4
  lr_min: 3e-6
  warmup_steps: 100
  grad_clip: 1.0
  aux_alpha: 0.01              # unused -- this model produces no balance loss

eval:
  log_every: 500
  eval_every: 1000
  eval_steps: 50
  prompt: "First Citizen:\nBefore we proceed"
  max_new_tokens: 100
  temperature: 0.8

checkpoint:
  path: checkpoints/deepseek-v3/train.pt
  save_every: 1000

hydra:
  job:
    chdir: false               # keep cwd at repo root so relative paths resolve
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
