# GPT-2 style: MHA + dense FFN + sinusoidal positional embeddings
# Baseline for the three-way comparison. Everything outside the `model` block
# is identical across gpt-2 / deepseek-v1 / deepseek-v2 -- only architecture varies.
# Run with: python train.py --config-name gpt-2

name: gpt-2

seed: 1337
device: auto        # auto | cuda | cpu
compile: false      # keep false across all three so wall-clock stays comparable

data:
  dataset_name: tiny_shakesphere
  corpus_path: ./data/_data/tiny_shakesphere.txt
  test_split: 0.05             # 5/5 split leaves 90% (~394K tokens) for training
  val_split: 0.05

tokenizer:
  path: ./data/_data/tokenizer/tiny_shakesphere/
  vocab_size: 5000
  min_occurrences: 10

model:
  _target_: models.gpt_v2.GPT2
  d_in: 32
  max_seq_length: 512          # context limit -- sizes the positional embedding
  d_transformer: 32
  n_blocks: 4
  transformer_n_heads: 4       # head_dim = 32
  d_ff: 256                    # 4 * d_in, the standard dense FFN
  dropout: 0.2                 # essential -- 3M params on ~394K tokens

optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.1
  betas: [0.9, 0.95]           # lr comes from training.lr_peak

training:
  n_steps: 10000
  batch_size: 256
  seq_len: 512                 # must be <= model.max_seq_length
  lr_peak: 3e-4
  lr_min: 3e-6
  warmup_steps: 100
  grad_clip: 1.0

eval:
  log_every: 500
  eval_every: 1000              # frequent -- best val lands well before step 3000
  eval_steps: 50
  prompt: "First Citizen:\nBefore we proceed"
  max_new_tokens: 100
  temperature: 0.8

checkpoint:
  path: checkpoints/gpt-2/train.pt
  save_every: 1000

hydra:
  job:
    chdir: false               # keep cwd at repo root so relative paths resolve
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
